name: Landlock integration tests (GitHub-hosted)
on:
  push:
    branches: [ci-landlock-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landlock:
    name: landlock (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # main's code plus the integration test each PR branch adds, to
          # show which new tests fail without the fix.
          - name: main-with-new-tests
            branch: main
            tests_from: >-
              landlock-readonly-disk landlock-vsock-dir-makesock
              landlock-flag-without-payload landlock-newer-abi
          - name: landlock-readonly-disk
            branch: landlock-readonly-disk
          - name: landlock-vsock-dir-makesock
            branch: landlock-vsock-dir-makesock
          - name: landlock-flag-without-payload
            branch: landlock-flag-without-payload
          - name: landlock-newer-abi
            branch: landlock-newer-abi
          # landlock-newer-abi with IoctlDev removed from the "r" access, to
          # show test_landlock_block_device_ioctl fails without that grant.
          - name: landlock-newer-abi-mutant-no-ioctldev-on-read
            branch: landlock-newer-abi
            mutant: no-ioctldev-on-read
    env:
      # Every integration test that passes --landlock: the name filter catches
      # the ones with "landlock" in their name; test_serial_socket_stale_cleanup
      # also passes --landlock on x86_64 and is added as a second filter.
      TEST_FILTER: landlock
      EXTRA_FILTER: test_serial_socket_stale_cleanup
      PARALLEL_INTEGRATION_TESTS_NUM: 2
    steps:
      - name: Code checkout (${{ matrix.branch }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}

      - name: Add the new integration tests from the PR branches
        if: matrix.tests_from != ''
        env:
          TESTS_FROM: ${{ matrix.tests_from }}
        run: |
          set -eux
          for b in $TESTS_FROM; do
            git fetch --no-tags --depth=1 origin "$b"
            git diff HEAD FETCH_HEAD -- cloud-hypervisor/tests | git apply --3way
          done
          git diff --cached --stat

      - name: Mutate (no IoctlDev on the "r" access)
        if: matrix.mutant == 'no-ioctldev-on-read'
        run: |
          set -eux
          f=vmm/src/landlock.rs
          grep -q 'AccessFs::from_read(ABI) | AccessFs::IoctlDev' "$f"
          sed -i 's/AccessFs::from_read(ABI) | AccessFs::IoctlDev/AccessFs::from_read(ABI)/' "$f"
          git diff

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Prepare KVM access
        run: |
          set -eux
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Host diagnostics (kernel, LSMs, Landlock ABI)
        run: |
          set -eux
          uname -a
          nproc
          free -g
          cat /sys/kernel/security/lsm || true
          # landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION) returns the ABI version.
          python3 -c 'import ctypes; l=ctypes.CDLL(None, use_errno=True); r=l.syscall(444, None, 0, 1); print("landlock ABI:", r, "errno:", ctypes.get_errno())'

      - name: Skip the feature-variant reruns (no Landlock test lives in them)
        # The upstream script rebuilds with dbus_api, fw_cfg and ivshmem and
        # reruns only those modules; none holds a Landlock test, and each
        # rebuild is a full LTO release build on a 4-core runner.
        run: |
          set -eux
          f=scripts/run_integration_tests_x86_64.sh
          grep -q '^# Run tests on dbus_api' "$f"
          sed -i '/^# Run tests on dbus_api/,/^exit \$RES/{/^exit \$RES/!d}' "$f"
          tail -n 5 "$f"

      - name: Run Landlock integration tests
        timeout-minutes: 75
        run: scripts/dev_cli.sh tests --integration --libc gnu -- --test-filter "$TEST_FILTER" -- "$EXTRA_FILTER"

      - name: Per-test results (junit)
        if: always()
        run: |
          python3 - "$HOME/workloads/junit/common.xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception as e:
              print(f"no junit report: {e}")
              sys.exit(0)
          cases = list(root.iter("testcase"))
          print(f"{len(cases)} test case(s) selected")
          if not cases:
              sys.exit("the test filter selected no tests")
          for tc in cases:
              name = f'{tc.get("classname")}::{tc.get("name")}'
              status = "PASS"
              for tag in ("failure", "error"):
                  el = tc.find(tag)
                  if el is not None:
                      status = "FAIL"
                      print(f"RESULT {status} {name}")
                      print((el.get("message") or "")[:2000])
                      print((el.text or "")[-4000:])
                      break
              else:
                  flaky = tc.findall("flakyFailure") + tc.findall("rerunFailure")
                  if flaky:
                      status = f"PASS-after-{len(flaky)}-retries"
                  if tc.find("skipped") is not None:
                      status = "SKIP"
                  print(f"RESULT {status} {name}")
          EOF

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.name }}
          path: ~/workloads/junit/
          if-no-files-found: warn
